server:
  port: 83


spring:
  application:
    name: nacos-order-consumer
  cloud:
    nacos:
      discovery:
        server-addr: 116.205.224.221:8848 #Nacos服务注册中心地址
        username: nacos
        password: nacos_123
        namespace: public             # 命名空间
        group: DEFAULT_GROUP          # 服务分组
        watch-delay: 30000
        watch:
          enabled: true
        heart-beat:
          enabled: true
        heart-beat-interval: 5000
        heart-beat-timeout: 5000

dubbo:
  application:
    name: ${spring.application.name}
  registry:
    address: nacos://116.205.224.221:8848  # Nacos 作为注册中心
  protocol:
    name: dubbo
    port: 20880
  consumer:
    check: false
    timeout: 3000

#消费者将要去访问的微服务名称(注册成功进nacos的微服务提供者)
service-url:
  nacos-user-service: http://nacos-payment-provider


